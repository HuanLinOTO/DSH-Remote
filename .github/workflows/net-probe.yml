name: Net probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: DNS + connectivity
        run: |
          set +e
          echo "== python resolve =="
          python3 - <<'PY'
          import socket
          for fam, label in ((socket.AF_INET, 'A'), (socket.AF_INET6, 'AAAA')):
              try:
                  print(label, socket.getaddrinfo('services.gradle.org', 443, fam))
              except Exception as e:
                  print(label, 'ERR', e)
          PY
          echo "== getent =="
          getent ahosts services.gradle.org
          echo "== curl -4 official =="
          curl -sS -4 -o /dev/null -w 'code=%{http_code} ip=%{remote_ip}\n' --max-time 20 -I https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          echo "== curl -6 official =="
          curl -sS -6 -o /dev/null -w 'code=%{http_code} ip=%{remote_ip}\n' --max-time 20 -I https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          echo "== curl -4 downloads.gradle.org =="
          curl -sS -4 -o /dev/null -w 'code=%{http_code} ip=%{remote_ip}\n' --max-time 20 -I https://downloads.gradle.org/distributions/gradle-8.14.3-bin.zip
          echo "== curl -4 tencent =="
          curl -sS -4 -o /dev/null -w 'code=%{http_code} ip=%{remote_ip}\n' --max-time 20 -I https://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-bin.zip
          echo "== curl -4 nju =="
          curl -sS -4 -o /dev/null -w 'code=%{http_code} ip=%{remote_ip}\n' --max-time 20 -I https://mirror.nju.edu.cn/gradle/gradle-8.14.3-bin.zip
          echo "== preinstalled gradle =="
          which gradle || true
          gradle --version 2>&1 | head -12
          echo "== ipv6 =="
          ip -6 addr show scope global | head -20
          echo "== wrapper props =="
          cat src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties

      - name: Wrapper official + preferIPv4Stack
        working-directory: src-tauri/gen/android
        run: |
          set +e
          GRADLE_OPTS="-Djava.net.preferIPv4Stack=true" timeout 300 ./gradlew --version --no-daemon
          echo "official_exit=$?"

      - name: Wrapper mirror tencent + preferIPv4Stack
        working-directory: src-tauri/gen/android
        run: |
          set +e
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties
          GRADLE_OPTS="-Djava.net.preferIPv4Stack=true" timeout 600 ./gradlew --version --no-daemon
          echo "tencent_exit=$?"
