name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Preflight: is Android release signing configured?
  # (secrets cannot be read in a job-level `if`, so map them to an output)
  # ============================================
  preflight:
    runs-on: ubuntu-latest
    outputs:
      android_signing: ${{ steps.check.outputs.android_signing }}
    steps:
      - id: check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "android_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "android_signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 is not configured — skipping Android artifacts"
          fi

  # ============================================
  # Desktop builds (Windows, macOS, Linux)
  # ============================================
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            arch: aarch64
            os: macos
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            arch: x86_64
            os: macos
          - platform: ubuntu-22.04
            args: ''
            arch: x86_64
            os: linux
          - platform: windows-latest
            args: ''
            arch: x86_64
            os: windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.os }}-${{ matrix.arch }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # tauri-action runs beforeBuildCommand (npm run build) + cargo build.
      # tauriScript is pinned to npm: the repo also carries a pnpm-lock.yaml,
      # which would otherwise make the action shell out to a pnpm that CI
      # never installed (we install with `npm ci`).
      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: npm run tauri
          args: ${{ matrix.args }}

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          BUNDLE_DIR="src-tauri/target/release/bundle"
          if [[ "${{ matrix.os }}" == "macos" ]]; then
            BUNDLE_DIR="src-tauri/target/${{ matrix.arch }}-apple-darwin/release/bundle"
          fi

          if [[ "${{ matrix.os }}" == "windows" ]]; then
            find "$BUNDLE_DIR/nsis" -name "*.exe" -exec cp {} release-artifacts/ \; 2>/dev/null || true
          elif [[ "${{ matrix.os }}" == "macos" ]]; then
            find "$BUNDLE_DIR/dmg" -name "*.dmg" -exec cp {} release-artifacts/ \; 2>/dev/null || true
          elif [[ "${{ matrix.os }}" == "linux" ]]; then
            find "$BUNDLE_DIR/deb" -name "*.deb" -exec cp {} release-artifacts/ \; 2>/dev/null || true
            find "$BUNDLE_DIR/appimage" -name "*.AppImage" -exec cp {} release-artifacts/ \; 2>/dev/null || true
          fi

          echo "Artifacts:"
          ls -R release-artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: release-artifacts
          if-no-files-found: warn
          retention-days: 1

  # ============================================
  # Android builds (arm64 + armv7 并行；缺少签名密钥时整体跳过)
  # ============================================
  build-android:
    needs: preflight
    if: needs.preflight.outputs.android_signing == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            rust_target: aarch64-linux-android
            label: arm64
          - target: armv7
            rust_target: armv7-linux-androideabi
            label: armv7
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "ndk;29.0.14206865"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android-${{ matrix.target }}

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            src-tauri/gen/android/.gradle
          key: gradle-${{ matrix.target }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - run: npm ci

      # gen/android/app/build.gradle.kts reads storeFile/storePassword/keyAlias/keyPassword
      # (secret values are stripped of any trailing CR/LF so they cannot corrupt the password)
      - name: Setup Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS_PW=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          KS_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')
          KS_KEY_PW=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/keystore.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/keystore.jks
          storePassword=$KS_PW
          keyAlias=$KS_ALIAS
          keyPassword=$KS_KEY_PW
          EOF

      # The Gradle wrapper's own download died on runners with
      # `java.net.ConnectException: Connection refused` although plain curl to the
      # same host answered 307 (2026-09-09, both android jobs). Fetch the
      # distribution with curl instead (multi-mirror + retries + checksum) and
      # point the wrapper at the local file, so no build step depends on the
      # wrapper JVM's HTTPS stack.
      - name: Provision Gradle distribution
        shell: bash
        run: |
          set -euo pipefail
          # machine-local proxy settings (systemProp.*) must never be committed:
          # the wrapper and the Gradle daemon would route every request to a
          # proxy that does not exist on the runner
          if grep -n '^systemProp\.' src-tauri/gen/android/gradle.properties; then
            echo "::error::src-tauri/gen/android/gradle.properties must not contain machine-local systemProp.* entries"
            exit 1
          fi
          VERSION="8.14.3"
          SHA256="bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531"
          DIST_NAME="gradle-${VERSION}-bin"
          ZIP_DIR="$HOME/.gradle-dist"
          ZIP="$ZIP_DIR/${DIST_NAME}.zip"
          PROPS="src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties"
          DIST_DIR="$HOME/.gradle/wrapper/dists/${DIST_NAME}"

          # gradlew is committed without the executable bit (mode 100644)
          chmod +x src-tauri/gen/android/gradlew

          if find "$DIST_DIR" -maxdepth 2 -name '*.ok' -print -quit 2>/dev/null | grep -q .; then
            echo "Gradle ${VERSION} already extracted from the wrapper cache"
          else
            mkdir -p "$ZIP_DIR"
            if [ ! -f "$ZIP" ] || ! echo "${SHA256}  ${ZIP}" | sha256sum -c - >/dev/null 2>&1; then
              for URL in \
                "https://services.gradle.org/distributions/${DIST_NAME}.zip" \
                "https://downloads.gradle.org/distributions/${DIST_NAME}.zip" \
                "https://mirrors.cloud.tencent.com/gradle/${DIST_NAME}.zip" \
                "https://mirror.nju.edu.cn/gradle/${DIST_NAME}.zip"; do
                echo "::group::curl $URL"
                rm -f "${ZIP}.part"
                if curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 \
                     --connect-timeout 20 --max-time 900 -o "${ZIP}.part" "$URL"; then
                  mv "${ZIP}.part" "$ZIP"
                  echo "::endgroup::"
                  break
                fi
                echo "::endgroup::"
              done
            fi
            echo "${SHA256}  ${ZIP}" | sha256sum -c -
          fi

          # a file:// URL keeps the wrapper hash dir stable across runs
          sed -i "s#^distributionUrl=.*#distributionUrl=file://${ZIP}#" "$PROPS"
          grep -q '^distributionSha256Sum=' "$PROPS" \
            || echo "distributionSha256Sum=${SHA256}" >> "$PROPS"
          cat "$PROPS"

          # keep the Gradle JVM on IPv4: runners have no IPv6 route, and the
          # daemon also fetches plugins/deps over HTTPS
          echo "GRADLE_OPTS=-Djava.net.preferIPv4Stack=true" >> "$GITHUB_ENV"

      - name: Build and verify APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: |
          VERSION="${{ github.ref_name }}"
          npx tauri android build --apk --target ${{ matrix.target }}

          APK=$(find src-tauri/gen/android/app/build/outputs/apk -path '*/release/*.apk' -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::no release APK produced"
            exit 1
          fi

          mkdir -p release-artifacts
          DEST="DSH-Remote-${VERSION}-android-${{ matrix.label }}.apk"
          cp "$APK" "release-artifacts/$DEST"

          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools/" | tail -1)"
          "$BT/apksigner" verify --print-certs "release-artifacts/$DEST"

      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-android-${{ matrix.label }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 1

  # ============================================
  # Publish Release
  # ============================================
  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [preflight, build-desktop, build-android]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: Display artifacts
        run: ls -R artifacts

      - name: Extract changelog
        run: |
          TAG="${{ github.ref_name }}"
          BODY=$(sed -n "/^## \[${TAG}\]/,/^## \[/{ /^## \[${TAG}\]/d; /^## \[/d; p; }" CHANGELOG.md)
          BODY=$(echo "$BODY" | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba;}')
          if [ -z "$BODY" ]; then
            BODY="No changelog entry found for ${TAG}."
          fi
          {
            echo "$BODY"
            echo
            echo '---'
            echo
            echo '**Desktop:** Windows (.exe), macOS (.dmg), Linux (.deb, .AppImage)'
            echo
            echo '**Android:** Android (.apk) — arm64, armeabi-v7a'
            echo
            echo '> 本仓库是 [ds-harness-remote](https://github.com/liguobao/ds-harness-remote) 的第三方客户端，'
            echo '> UI 修改自 [OpenCodeUI](https://github.com/lehhair/OpenCodeUI)（GPL-3.0 衍生作品）。'
          } > /tmp/release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'DSH Remote ${{ github.ref_name }}'
          body_path: /tmp/release-body.md
          files: artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'canary') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
