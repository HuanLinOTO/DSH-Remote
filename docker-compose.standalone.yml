# ============================================
# DSH Remote — 纯前端独立部署（同源反代）
# ============================================
# 静态前端 + Caddy 把 /api、/ws 反代到 DSH Remote Server，绕过浏览器跨源限制。
# （Tauri 桌面 / Android 构建不受 CORS 影响，不需要本文件。）
#
# 使用方法：
#   docker compose -f docker-compose.standalone.yml up -d --build
#
# 环境变量：
#   DSH_SERVER - 上游 DSH Remote Server（host[:port]，默认 dsh.r2049.cn:443）
#   PORT       - 前端监听端口（默认 3000）
#   IMAGE      - 使用已构建镜像时指定（跳过本地构建）

services:
  frontend:
    image: ${IMAGE:-dsh-remote-frontend:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: dsh-remote
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    command: ['caddy', 'run', '--config', '/etc/caddy/Caddyfile.standalone']
    environment:
      - DSH_SERVER=${DSH_SERVER:-dsh.r2049.cn:443}
